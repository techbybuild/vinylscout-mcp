name: Publish to Official MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.12

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -O "${base_url}/${archive}"
          curl --fail --location --silent --show-error -O "${base_url}/checksums.txt"
          grep "${archive}" checksums.txt | sha256sum --check
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to Official MCP Registry
        run: ./mcp-publisher publish
