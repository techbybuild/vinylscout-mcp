name: Update Dutch LP Price Index CSV

on:
  schedule:
    # Runs on the 2nd of every month at 07:00 UTC
    - cron: '0 7 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest LP-prijsindex CSV
        run: |
          mkdir -p data
          curl -fsSL "https://vinylscout.nl/lp-prijsindex/csv" -o data/lp-prijsindex.csv
          test -s data/lp-prijsindex.csv

      - name: Commit updated dataset if changed
        run: |
          if git diff --quiet data/lp-prijsindex.csv; then
            echo "No changes in lp-prijsindex.csv"
            exit 0
          fi
          git config user.name "Tech by Build Bot"
          git config user.email "mail@techbybuild.com"
          git add data/lp-prijsindex.csv
          git commit -m "Update lp-prijsindex.csv ($(date -u +%Y-%m-%d))"
          git push
